aid: paraglide
name: Paraglide
description: >-
  Paraglide is a British-Swedish AI company building autonomous agents that
  automate accounts receivable for high-volume B2B finance teams. Its agents
  handle two-way billing communication across the order-to-cash lifecycle:
  answering customer billing questions, chasing overdue invoices, resolving
  disputes and deductions, running collections, operating a supplier portal, and
  applying cash — integrating with ERPs, CRMs, and billing software to cut Days
  Sales Outstanding and improve cash flow. Founded in 2025 by Rasmus Areskoug and
  Andreas Astrom with offices in London and Malmo, Paraglide raised a $5M seed
  round led by Bessemer Venture Partners and DN Capital in January 2026. As of
  this profile the company is a product/agent platform with no public developer
  API, SDK, or documentation surface.
